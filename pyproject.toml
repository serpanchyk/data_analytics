dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.0",
    "h3>=4.5.0",
    "ipykernel>=7.3.0",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "openpyxl>=3.1.5",
    "osmnx>=2.1",
    "pandas>=3.0.5",
    "pulp>=2.8,<3",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
